version: 1
output: dist
cache: .cache
icon: icon.png

node:
  version: 24.19.0
  base_url: https://npmmirror.com/mirrors/node

dsh:
  package: "@deepseek-ai/dsh"
  version: 0.1.0-rc.6
  # Prebuilt npm package specs added here are installed into the runtime.
  plugins:
    - ./plugins/dsh-desktop

macos:
  format: dmg
  app_name: DeepSeek Harness
  bundle_id: ai.deepseek.dsh
  volume_name: DeepSeek Harness
  sign:
    enabled: false
    # identity: "Developer ID Application: Example Corp (TEAMID)"

windows:
  format: nsis
  app_name: DeepSeek Harness
  publisher: DeepSeek AI
  # user avoids UAC; machine installs under Program Files.
  install_scope: user

linux:
  formats: [deb, rpm]
  package_name: dsh
  app_name: DeepSeek Harness
  maintainer: DeepSeek Harness <noreply@deepseek.com>
  description: DeepSeek Harness desktop client
  vendor: DeepSeek AI
  homepage: https://github.com/deepseek-ai/deepseek-harness
  license: MIT
  depends:
    deb: [libgtk-4-1, libwebkitgtk-6.0-4]
    rpm: [gtk4, webkitgtk6.0]

runtime:
  # gui uses the OS WebView; serve only starts the Web UI server.
  mode: gui
  host: 127.0.0.1
  port: 3080

targets:
  - os: windows
    arch: amd64
  - os: windows
    arch: arm64
  - os: darwin
    arch: amd64
  - os: darwin
    arch: arm64
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
